# Debezium Server Configuration for Windows + Existing RabbitMQ

# RabbitMQ Sink Configuration (connects to your existing RabbitMQ)
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=host.docker.internal
debezium.sink.rabbitmq.connection.port=5672
debezium.sink.rabbitmq.connection.username=guest
debezium.sink.rabbitmq.connection.password=guest
debezium.sink.rabbitmq.connection.virtual.host=/

# Exchange and Routing
debezium.sink.rabbitmq.exchange=audit.exchange
debezium.sink.rabbitmq.routing.key=${routedByValue:topic}
debezium.sink.rabbitmq.routing.key.delimiter=.

# Message Format
debezium.format.value=json
debezium.format.key=json
debezium.format.value.schemas.enable=false
debezium.format.key.schemas.enable=false

# Health Check
quarkus.http.port=8080
quarkus.log.console.enable=true
quarkus.log.level=INFO
quarkus.log.category."io.debezium".level=INFO

# MySQL Source Connector
debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector

# Offset Storage (file-based for standalone)
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=10000

# Schema History Storage
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat

# Database Connection (adjust for your Windows MySQL)
debezium.source.database.hostname=host.docker.internal
debezium.source.database.port=3306
debezium.source.database.user=debezium_user
debezium.source.database.password=debezium_pass
debezium.source.database.server.id=184054
debezium.source.database.server.name=audit_mysql

# Database and Table Selection
debezium.source.database.include.list=manufacturing_db
debezium.source.table.include.list=manufacturing_db.sales_order_release_line,manufacturing_db.rohs_peers,manufacturing_db.sales_order,manufacturing_db.sales_order_line_detail

# Snapshot Configuration
debezium.source.snapshot.mode=when_needed
debezium.source.snapshot.locking.mode=minimal

# Binlog Configuration
debezium.source.binlog.buffer.size=8192
debezium.source.max.batch.size=2048
debezium.source.max.queue.size=8192

# Message Transformations
debezium.transforms=unwrap,addTopicPrefix
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.transforms.unwrap.drop.tombstones=false
debezium.transforms.unwrap.delete.handling.mode=rewrite
debezium.transforms.addTopicPrefix.type=org.apache.kafka.connect.transforms.RegexRouter
debezium.transforms.addTopicPrefix.regex=(.*)
debezium.transforms.addTopicPrefix.replacement=audit.$1

# Topic to RabbitMQ Routing Key Mapping
debezium.sink.rabbitmq.routing.key=audit.${routedByValue:table}