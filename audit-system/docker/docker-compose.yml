version: '3.8'
services:
  # Only Debezium Server - using existing RabbitMQ on Windows host
  debezium-server:
    image: debezium/server:2.4
    container_name: audit_debezium_server
    ports:
      - "8080:8080"  # Health check endpoint
    volumes:
      - ./debezium:/debezium/conf
      - debezium_data:/debezium/data
    environment:
      - JAVA_OPTS=-Xmx512m -Dquarkus.log.level=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  debezium_data: